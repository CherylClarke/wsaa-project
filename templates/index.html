<!DOCTYPE html>
<html>
<head>
    <title>Movie Collection App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Movie Collection App</h1>

        <div class="card p-4 mb-4">
            <h3>Add / Edit Movie</h3>

            <input type="hidden" id="movieId">

            <div class="mb-3">
                <label>Title</label>
                <input type="text" id="title" class="form-control">
            </div>

            <div class="mb-3">
                <label>Genre</label>
                <input type="text" id="genre" class="form-control">
            </div>

            <div class="mb-3">
                <label>Year</label>
                <input type="number" id="year" class="form-control">
            </div>

            <div class="mb-3">
                <label>Rating</label>
                <input type="number" id="rating" class="form-control" min="1" max="10">
            </div>

            <button onclick="saveMovie()" class="btn btn-primary">Save Movie</button>
            <button onclick="clearForm()" class="btn btn-secondary">Clear</button>
        </div>

        <div class="card p-4">
            <h3>Movie List</h3>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Year</th>
                        <th>Rating</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="movieTable"></tbody>
            </table>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
